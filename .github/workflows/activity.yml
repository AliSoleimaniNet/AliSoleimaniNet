name: recent-activity

# Only first-party actions (pinned to commit SHAs) and our own script run here.
# The script prints nothing but a status line; it never logs repository names.

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Update the Latest block
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/activity.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update recent activity"
          git push
