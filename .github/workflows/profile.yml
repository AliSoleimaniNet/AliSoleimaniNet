name: profile-assets

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile.yml", "scripts/dynamic.mjs", "scripts/annotate-3d.mjs", "scripts/lib/**"]

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Stat tiles, repository cards and the languages card, rendered from the API
      - name: Dynamic cards
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          EXTRA_REPOS: ${{ secrets.EXTRA_REPOS }}
        run: node scripts/dynamic.mjs dist

      - name: Snake
        uses: Platane/snk@v3
        continue-on-error: true
        with:
          github_user_name: AliSoleimaniNet
          outputs: |
            dist/snake/snake-light.svg
            dist/snake/snake-dark.svg?palette=github-dark

      - name: 3D contributions
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: AliSoleimaniNet
          MAX_REPOS: 100

      - name: Collect
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist 2>/dev/null || true
          mkdir -p dist/3d
          cp profile-3d-contrib/profile-night-green.svg   dist/3d/ 2>/dev/null || true
          cp profile-3d-contrib/profile-green-animate.svg dist/3d/ 2>/dev/null || true
          node scripts/annotate-3d.mjs dist/3d || true
          find dist -type f | sort

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          jekyll: false
          commit_message: "Refresh profile assets"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
