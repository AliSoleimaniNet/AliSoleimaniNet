name: profile-assets

# Security notes (this repository is public, and so are its Actions logs):
# - Third-party actions are pinned to full commit SHAs and run in a job with a READ-ONLY token.
# - METRICS_TOKEN is only exposed to our own script (scripts/dynamic.mjs), never to third-party code.
# - Publishing uses plain git in a separate job; no third-party code runs with write access.
# - Scripts must never print repository names: private repos are counted, not named.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile.yml", "scripts/dynamic.mjs", "scripts/annotate-3d.mjs", "scripts/lib/**"]

permissions: {}

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # Stat tiles, repository cards and the languages card, rendered from the API by our own script
      - name: Dynamic cards
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          EXTRA_REPOS: ${{ secrets.EXTRA_REPOS }}
        run: node scripts/dynamic.mjs dist

      - name: Snake
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        continue-on-error: true
        with:
          github_user_name: AliSoleimaniNet
          outputs: |
            dist/snake/snake-light.svg
            dist/snake/snake-dark.svg?palette=github-dark

      # Public data only: gets the read-only repository token, never the personal token
      - name: 3D contributions
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: AliSoleimaniNet
          MAX_REPOS: 100

      - name: Collect
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist 2>/dev/null || true
          mkdir -p dist/3d
          cp profile-3d-contrib/profile-night-green.svg   dist/3d/ 2>/dev/null || true
          cp profile-3d-contrib/profile-green-animate.svg dist/3d/ 2>/dev/null || true
          node scripts/annotate-3d.mjs dist/3d || true
          echo "files: $(find dist -type f | wc -l)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: profile-assets
          path: dist
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: profile-assets
          path: dist

      - name: Force-push to the output branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cd dist
          touch .nojekyll
          git init -q -b output
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Refresh profile assets"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${REPO}.git" output
